adminPassword: pizza        # lab only!
fullnameOverride: grafana
service: {port: 3000}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus.alerting-lab.svc:9090
        isDefault: true
        access: proxy
sidecar:
  dashboards: {enabled: false}
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - {name: lab, folder: "Pizzeria", type: file, options: {path: /var/lib/grafana/dashboards/lab}}
# the dashboard JSON is injected by scripts/up.sh with: --set-file dashboards.lab.pizzeria.json=dashboard.json
# Alerting resources are NOT provisioned by default: YOU build them in the UI.
# `./scripts/solution.sh` loads solution/alerting-values.yaml on top of this file.
