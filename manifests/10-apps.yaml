apiVersion: v1
kind: Namespace
metadata:
  name: alerting-lab
---
# 🍕 the pizzeria (same app as the monitoring lab). Prometheus finds it through the
# prometheus.io/* ANNOTATIONS on the pod template - no Prometheus Operator in this lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizzeria
  namespace: alerting-lab
  labels: {app: pizzeria}
spec:
  replicas: 2
  selector:
    matchLabels: {app: pizzeria}
  template:
    metadata:
      labels: {app: pizzeria}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: pizzeria
          image: python:3.12-alpine
          command: ["python", "-u", "/app/pizzeria.py"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes:
        - name: code
          configMap: {name: pizzeria-code}
---
# 📬 where alerts land
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: alerting-lab
  labels: {app: webhook-sink}
spec:
  replicas: 1
  selector:
    matchLabels: {app: webhook-sink}
  template:
    metadata:
      labels: {app: webhook-sink}
    spec:
      containers:
        - name: sink
          image: python:3.12-alpine
          command: ["python", "-u", "/app/webhook_sink.py"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes:
        - name: code
          configMap: {name: webhook-sink-code}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: alerting-lab
spec:
  selector: {app: webhook-sink}
  ports: [{port: 8080, targetPort: 8080}]
